<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Viewer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Modern Markdown styles */
        .markdown-body {
            max-width: 700px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            border-bottom: 1px solid #eee;
            padding-bottom: 0.3em;
            margin-top: 1.5em;
        }
        .markdown-body pre {
            background: #f6f8fa;
            padding: 1em;
            border-radius: 6px;
            overflow-x: auto;
        }
        .markdown-body code {
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 4px;
        }
        .markdown-body blockquote {
            border-left: 4px solid #d0d7de;
            padding-left: 1em;
            color: #6a737d;
            background: #f6f8fa;
        }
        .markdown-body ul, .markdown-body ol {
            margin-left: 2em;
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="article" class="markdown-body">Loading article...</div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    // Get article name from URL query (?name=...)
    function getArticleName() {
        const params = new URLSearchParams(window.location.search);
        let name = params.get('name');
        // Default to test.md if not specified
        if (!name) name = 'test.md';
        // Prevent directory traversal
        if (!/^[\w\-.]+\.md$/.test(name)) return null;
        return name;
    }

    const articleName = getArticleName();
    const fetchUrl = 'assets/articles/' + articleName;
    if (!articleName) {
        document.getElementById('article').textContent = 'Invalid article name.';
    } else {
        document.getElementById('article').textContent = 'Loading: ' + fetchUrl;
        fetch(fetchUrl)
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
            })
            .then(md => {
                document.getElementById('article').innerHTML = marked.parse(md);
            })
            .catch(err => {
                document.getElementById('article').textContent = 'Failed to load article. (' + err + ')';
                console.error('Error fetching', fetchUrl, err);
            });
    }
    </script>
</body>
</html>
